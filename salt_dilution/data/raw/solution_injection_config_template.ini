[file_operations]
folder_path= path\to\output\folder
injection_data = name_of_data_file.csv
calibration_csv_name= filepath/name_of_solution_injection_calibration.csv

[calibration]
volume_injection_solution_sample=10
volume_calibration_solution=1000


[injection]
mass_salt=4000
volume_primary_solution=13000
bg_start = 16:03:47 #start time of recording
bg_end = 16:10:58 # time of injection
trial_start = 16:15:11 # time when conductivity starts to rise
trial_end = 16:18:01 # time when conductivity returns to background
record_end = 16:59:09 # end time of recording

[constants]
rho_salt = 2.165 # used to estimate the volume of the salt solution