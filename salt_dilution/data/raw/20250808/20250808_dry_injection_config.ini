[file_operations]
folder_path= path\to\data\folder
injection_data = name_of_data_file.csv
calibration_csv_name= filepath/name_of_solution_injection_calibration.csv

[calibration]
volume_calibration_solution=1000
mass_salt=2

[injection]
mass_salt=4000
volume_primary_solution=13000
bg_start = 09:07:27 #start time of recording
bg_end = 09:45:58 # time of injection
trial_start = 09:49:22 # time when conductivity starts to rise
trial_end = 09:57:17 # time when conductivity returns to background
record_end = 09:58:40 # end time of recording

[constants]
rho_salt = 2.165 # used to estimate the volume of the salt solution