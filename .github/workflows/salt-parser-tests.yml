name: Salt parser tests
on:
  push:
    paths:
      - 'salt_dilution/**'
      - 'tests/**'
      - 'project_paths.py'
      - '.github/workflows/salt-parser-tests.yml'
  pull_request:
    paths:
      - 'salt_dilution/**'
      - 'tests/**'
      - 'project_paths.py'
      - '.github/workflows/salt-parser-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: '1'
      MORA_REQUIRE_RAW_TESTS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install numpy pandas matplotlib openpyxl xlrd
      - run: python -m unittest discover -s tests -v
